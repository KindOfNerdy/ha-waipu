create_recording:
  name: Aufnahme starten
  description: >
    Plant eine Cloud-Aufnahme auf waipu.tv. Wenn keine program_id übergeben
    wird, wird das aktuell laufende Programm des Senders aufgenommen. Wenn
    auch keine station_id übergeben wird, wird der Sender genutzt, der
    aktuell über diese Integration eingestellt ist (waipu-media_player) —
    dafür muss vorher ein Sender darüber gewählt worden sein.
    Erfordert ein Abo mit Cloud-Aufnahmen (Perfect / Perfect Plus / O2 TV L/XL).
  fields:
    station_id:
      name: Sender-ID
      description: >
        Optional. Die waipu-Station-ID (z. B. ard, zdf, pro7, sat1). Leer =
        aktuell über diese Integration eingestellter Sender.
      required: false
      example: ard
      selector:
        text:
    program_id:
      name: Programm-ID (UUID)
      description: Optional. EPG-Programm-UUID. Leer = aktuell laufende Sendung.
      required: false
      example: "67ad0d26-e3a4-5c4f-9837-ced96ae3b7e0"
      selector:
        text:

stop_recording:
  name: Aufnahme stoppen
  description: >
    Stoppt eine gerade laufende Aufnahme vorzeitig — was bis dahin
    aufgenommen wurde, bleibt als kürzere abgeschlossene Aufnahme erhalten
    (anders als delete_recording, das komplett löscht). Praktisch kombiniert
    mit create_recording (beide ohne Parameter), um spontan nur ein paar
    Minuten einer Sendung mitzuschneiden. Wenn keine recording_id übergeben
    wird, wird die laufende Aufnahme auf dem aktuell über diese Integration
    eingestellten Sender gestoppt.
  fields:
    recording_id:
      name: Aufnahme-ID
      description: >
        Optional. Die ID der laufenden Aufnahme (z. B. aus den Attributen
        von calendar.waipu_aufnahmen). Leer = laufende Aufnahme auf dem
        aktuell eingestellten Sender.
      required: false
      example: "1206434822"
      selector:
        text:

delete_recording:
  name: Aufnahme löschen
  description: Löscht eine oder mehrere Cloud-Aufnahmen.
  fields:
    recording_id:
      name: Aufnahme-ID(s)
      description: Eine Aufnahme-ID oder eine Liste von IDs.
      required: true
      example: "1206434822"
      selector:
        object:

create_serial_recording:
  name: Serien-Aufnahme starten
  description: >
    Nimmt künftig jede Folge der Serie auf, nicht nur das gewählte
    Programm — nutzt eine separate waipu-API (recording-scheduler), die
    anhand von Anfrage-Beispielen im Web-Client nachgebaut wurde. Live
    getestet und bestätigt funktionsfähig. Erfordert ein Abo mit
    Cloud-Aufnahmen und dass das Programm eine Serien-ID hat (fortlaufende
    Sendungen, keine Einzelausstrahlung).
  fields:
    station_id:
      name: Sender-ID
      description: Die waipu-Station-ID (z. B. ard, zdf, pro7, sat1).
      required: true
      example: ard
      selector:
        text:
    program_id:
      name: Programm-ID (UUID)
      description: >
        Optional. EPG-Programm-UUID einer Folge der Serie. Leer = aktuell
        laufende Sendung. Titel und Serien-ID werden daraus abgeleitet.
      required: false
      example: "67ad0d26-e3a4-5c4f-9837-ced96ae3b7e0"
      selector:
        text:

delete_serial_recording:
  name: Serien-Aufnahme beenden
  description: >
    Beendet eine laufende Serien-Aufnahme — künftige Folgen werden immer
    gestoppt, bereits aufgenommene/laufende Folgen bleiben erhalten,
    sofern nicht explizit zum Löschen ausgewählt.
  fields:
    series_id:
      name: Serien-ID
      description: >
        Die series_id aus den EPG-Attributen (z. B. sensor.<sender>_jetzt).
      required: true
      example: "104121"
      selector:
        text:
    delete_finished_recordings:
      name: Fertige Aufnahmen auch löschen
      description: Bereits abgeschlossene Aufnahmen dieser Serie mit entfernen.
      required: false
      default: false
      selector:
        boolean:
    delete_running_recordings:
      name: Laufende Aufnahmen auch löschen
      description: Gerade aufnehmende Folgen dieser Serie mit abbrechen.
      required: false
      default: false
      selector:
        boolean:

play_recording_on_android_tv:
  name: Aufnahme auf Android TV abspielen
  description: >
    Öffnet eine Cloud-Aufnahme per waipu-Deep-Link auf dem Android TV.
    Die Aufnahme muss fertig sein oder gerade aufnehmen.
  fields:
    recording_id:
      name: Aufnahme-ID
      description: >
        Die recording_id aus den Attributen von
        sensor.waipu_aufnahmen_aufnahmen_gesamt bzw. calendar.waipu_aufnahmen.
      required: true
      example: "1206434822"
      selector:
        text:
    mode:
      name: Start
      description: >
        Fortsetzen = an der von waipu gemerkten Stelle weiterschauen,
        Von vorn = ab Anfang abspielen, Nur Detailseite = Aufnahme öffnen,
        ohne abzuspielen.
      required: false
      default: resume
      selector:
        select:
          options:
            - label: Fortsetzen
              value: resume
            - label: Von vorn
              value: beginning
            - label: Nur Detailseite
              value: details
    position:
      name: Startposition (Sekunden)
      description: >
        Optional. Spielt ab dieser Stelle ab und hat Vorrang vor „Start“.
      required: false
      example: 600
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
          mode: box

open_program_on_android_tv:
  name: Sendung auf Android TV öffnen
  description: >
    Öffnet die Detailseite einer Sendung aus dem EPG auf dem Android TV —
    dort lassen sich Live sehen, Restart, Aufnehmen oder Erinnern wählen.
    Mit „Abspielen“ startet die Sendung direkt (bei einer laufenden Sendung
    heißt das live).
  fields:
    station_id:
      name: Sender-ID
      description: >
        Optional. Die waipu-Station-ID (z. B. zdf). Leer = aktuell über
        diese Integration eingestellter Sender.
      required: false
      example: zdf
      selector:
        text:
    program_id:
      name: Programm-ID
      description: >
        Optional. Die program_id aus den Sensoren „jetzt“/„danach“ (auch in
        deren upcoming-Liste) oder dem Aufnahmen-Kalender. Leer = laufende
        Sendung des Senders.
      required: false
      example: "ad8375c7-09d1-57b8-aaad-9a4f9f77d29c"
      selector:
        text:
    autoplay:
      name: Abspielen
      description: Sendung direkt abspielen statt die Detailseite zu öffnen.
      required: false
      default: false
      selector:
        boolean:

restart_program:
  name: Sendung von vorn
  description: >
    Springt bei der gerade auf dem Android TV laufenden Live-Sendung an
    ihren Anfang („Restart“). Geht nur bei Sendungen, die waipu spulen
    lässt — ob das gerade geht, zeigt das Attribut restart_available der
    Wiedergabe.

add_reminder:
  name: Erinnern und umschalten
  description: >
    Erinnert ein paar Minuten vorher per Push (Ziele in den Optionen) und
    schaltet den Fernseher zu Beginn auf den Sender. Entweder für eine
    Sendung (program_id), für jede Folge ihrer Serie (zusätzlich „Serie“)
    oder nach Zeitplan (Uhrzeit und Wochentage). Gibt die Erinnerung zurück.
  fields:
    station_id:
      name: Sender-ID
      description: Die waipu-Station-ID (z. B. zdf).
      required: true
      example: zdf
      selector:
        text:
    program_id:
      name: Programm-ID
      description: >
        Für eine Sendung: die program_id aus den Sensoren „jetzt“/„danach“
        oder der Programm-Karte. Leer lassen für einen Zeitplan.
      required: false
      selector:
        text:
    series:
      name: Serie
      description: Mit program_id an jede Folge dieser Serie auf dem Sender erinnern.
      required: false
      default: false
      selector:
        boolean:
    time:
      name: Uhrzeit
      description: Für einen Zeitplan (ohne program_id).
      required: false
      example: "20:15"
      selector:
        time:
    days:
      name: Wochentage
      description: Für einen Zeitplan. Leer = jeden Tag.
      required: false
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
          translation_key: weekdays
    once:
      name: Einmalig
      description: Zeitplan nur beim nächsten Mal, danach ausgeschaltet.
      required: false
      default: false
      selector:
        boolean:
    switch:
      name: Zu Beginn umschalten
      description: Aus = nur erinnern, der Fernseher bleibt, wo er ist.
      required: false
      default: true
      selector:
        boolean:

update_reminder:
  name: Erinnerung ändern
  description: Schaltet eine Erinnerung an oder aus, ändert das Umschalten oder lässt das nächste Mal aus.
  fields:
    reminder_id:
      name: Erinnerungs-ID
      description: Die id aus dem Attribut reminders des Sensors „Erinnerungen“.
      required: true
      selector:
        text:
    enabled:
      name: An
      required: false
      selector:
        boolean:
    switch:
      name: Zu Beginn umschalten
      required: false
      selector:
        boolean:
    skip_next:
      name: Nächstes Mal auslassen
      description: An = beim nächsten Mal weder erinnern noch umschalten; aus = wieder normal.
      required: false
      selector:
        boolean:

remove_reminder:
  name: Erinnerung löschen
  description: Löscht eine Erinnerung.
  fields:
    reminder_id:
      name: Erinnerungs-ID
      description: Die id aus dem Attribut reminders des Sensors „Erinnerungen“.
      required: true
      selector:
        text:
