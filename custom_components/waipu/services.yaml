create_recording:
  name: Aufnahme starten
  description: >
    Plant eine Cloud-Aufnahme auf waipu.tv. Wenn keine program_id übergeben
    wird, wird das aktuell laufende Programm des Senders aufgenommen.
    Erfordert ein Abo mit Cloud-Aufnahmen (Perfect / Perfect Plus / O2 TV L/XL).
  fields:
    station_id:
      name: Sender-ID
      description: Die waipu-Station-ID (z. B. ard, zdf, pro7, sat1).
      required: true
      example: ard
      selector:
        text:
    program_id:
      name: Programm-ID (UUID)
      description: Optional. EPG-Programm-UUID. Leer = aktuell laufende Sendung.
      required: false
      example: "67ad0d26-e3a4-5c4f-9837-ced96ae3b7e0"
      selector:
        text:

delete_recording:
  name: Aufnahme löschen
  description: Löscht eine oder mehrere Cloud-Aufnahmen.
  fields:
    recording_id:
      name: Aufnahme-ID(s)
      description: Eine Aufnahme-ID oder eine Liste von IDs.
      required: true
      example: "1206434822"
      selector:
        object:

create_serial_recording:
  name: Serien-Aufnahme starten
  description: >
    Nimmt künftig jede Folge der Serie auf, nicht nur das gewählte
    Programm — nutzt eine separate waipu-API (recording-scheduler), die
    anhand von Anfrage-Beispielen im Web-Client nachgebaut wurde. Live
    getestet und bestätigt funktionsfähig. Erfordert ein Abo mit
    Cloud-Aufnahmen und dass das Programm eine Serien-ID hat (fortlaufende
    Sendungen, keine Einzelausstrahlung).
  fields:
    station_id:
      name: Sender-ID
      description: Die waipu-Station-ID (z. B. ard, zdf, pro7, sat1).
      required: true
      example: ard
      selector:
        text:
    program_id:
      name: Programm-ID (UUID)
      description: >
        Optional. EPG-Programm-UUID einer Folge der Serie. Leer = aktuell
        laufende Sendung. Titel und Serien-ID werden daraus abgeleitet.
      required: false
      example: "67ad0d26-e3a4-5c4f-9837-ced96ae3b7e0"
      selector:
        text:

delete_serial_recording:
  name: Serien-Aufnahme beenden
  description: >
    Experimentell — anders als create_serial_recording noch nicht live
    getestet. Beendet eine laufende Serien-Aufnahme — künftige Folgen
    werden immer gestoppt, bereits aufgenommene/laufende Folgen bleiben
    erhalten, sofern nicht explizit zum Löschen ausgewählt.
  fields:
    series_id:
      name: Serien-ID
      description: >
        Die series_id aus den EPG-Attributen (z. B. sensor.<sender>_jetzt).
      required: true
      example: "104121"
      selector:
        text:
    delete_finished_recordings:
      name: Fertige Aufnahmen auch löschen
      description: Bereits abgeschlossene Aufnahmen dieser Serie mit entfernen.
      required: false
      default: false
      selector:
        boolean:
    delete_running_recordings:
      name: Laufende Aufnahmen auch löschen
      description: Gerade aufnehmende Folgen dieser Serie mit abbrechen.
      required: false
      default: false
      selector:
        boolean:

launch_on_apple_tv:
  name: Waipu auf Apple TV starten
  description: >
    Startet die Waipu-App auf dem in den Optionen konfigurierten Apple TV.
    Deep-Linking zu einem bestimmten Sender wird vom Waipu-tvOS-Client
    nicht unterstützt — der Sender muss anschließend manuell ausgewählt werden.
  fields:
    station_id:
      name: Sender-ID
      description: Aktuell nicht ausgewertet, reserviert für künftige Deep-Link-Unterstützung.
      required: false
      selector:
        text:

launch_on_android_tv:
  name: Waipu auf Android TV starten
  description: >
    Startet die Waipu-App auf dem in den Optionen konfigurierten Android TV
    (über die androidtv_remote-Integration). Deep-Linking zu einem
    bestimmten Sender wird nicht unterstützt — der Sender muss anschließend
    manuell ausgewählt werden.
  fields:
    station_id:
      name: Sender-ID
      description: Aktuell nicht ausgewertet, reserviert für künftige Deep-Link-Unterstützung.
      required: false
      selector:
        text:

switch_channel_on_android_tv:
  name: Sender auf Android TV wechseln (experimentell)
  description: >
    Schaltet den Sender per Zifferntasten-Eingabe um (wie eine echte
    Fernbedienung). Setzt voraus, dass die Waipu-App auf dem Android TV
    aktuell dieselbe Sender-Ansicht anzeigt (alle Sender / nur Favoriten),
    die unter "Kanalnummer-Basis" in den Integrations-Optionen eingestellt
    ist — das ist eine App-seitige Einstellung, die Home Assistant nicht
    auslesen oder erzwingen kann. Bei falscher Einstellung landet die
    Umschaltung auf dem falschen Sender.
  fields:
    station_id:
      name: Sender-ID
      description: Die waipu-Station-ID (z. B. ard, zdf, swr_bw).
      required: true
      example: swr_bw
      selector:
        text:
