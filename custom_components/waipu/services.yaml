create_recording:
  name: Aufnahme starten
  description: >
    Plant eine Cloud-Aufnahme auf waipu.tv. Wenn keine program_id übergeben
    wird, wird das aktuell laufende Programm des Senders aufgenommen. Wenn
    auch keine station_id übergeben wird, wird der Sender genutzt, der
    aktuell über diese Integration eingestellt ist (media_player/select) —
    dafür muss vorher ein Sender darüber gewählt worden sein.
    Erfordert ein Abo mit Cloud-Aufnahmen (Perfect / Perfect Plus / O2 TV L/XL).
  fields:
    station_id:
      name: Sender-ID
      description: >
        Optional. Die waipu-Station-ID (z. B. ard, zdf, pro7, sat1). Leer =
        aktuell über diese Integration eingestellter Sender.
      required: false
      example: ard
      selector:
        text:
    program_id:
      name: Programm-ID (UUID)
      description: Optional. EPG-Programm-UUID. Leer = aktuell laufende Sendung.
      required: false
      example: "67ad0d26-e3a4-5c4f-9837-ced96ae3b7e0"
      selector:
        text:

stop_recording:
  name: Aufnahme stoppen
  description: >
    Stoppt eine gerade laufende Aufnahme vorzeitig — was bis dahin
    aufgenommen wurde, bleibt als kürzere abgeschlossene Aufnahme erhalten
    (anders als delete_recording, das komplett löscht). Praktisch kombiniert
    mit create_recording (beide ohne Parameter), um spontan nur ein paar
    Minuten einer Sendung mitzuschneiden. Wenn keine recording_id übergeben
    wird, wird die laufende Aufnahme auf dem aktuell über diese Integration
    eingestellten Sender gestoppt.
  fields:
    recording_id:
      name: Aufnahme-ID
      description: >
        Optional. Die ID der laufenden Aufnahme (z. B. aus den Attributen
        von calendar.waipu_aufnahmen). Leer = laufende Aufnahme auf dem
        aktuell eingestellten Sender.
      required: false
      example: "1206434822"
      selector:
        text:

delete_recording:
  name: Aufnahme löschen
  description: Löscht eine oder mehrere Cloud-Aufnahmen.
  fields:
    recording_id:
      name: Aufnahme-ID(s)
      description: Eine Aufnahme-ID oder eine Liste von IDs.
      required: true
      example: "1206434822"
      selector:
        object:

create_serial_recording:
  name: Serien-Aufnahme starten
  description: >
    Nimmt künftig jede Folge der Serie auf, nicht nur das gewählte
    Programm — nutzt eine separate waipu-API (recording-scheduler), die
    anhand von Anfrage-Beispielen im Web-Client nachgebaut wurde. Live
    getestet und bestätigt funktionsfähig. Erfordert ein Abo mit
    Cloud-Aufnahmen und dass das Programm eine Serien-ID hat (fortlaufende
    Sendungen, keine Einzelausstrahlung).
  fields:
    station_id:
      name: Sender-ID
      description: Die waipu-Station-ID (z. B. ard, zdf, pro7, sat1).
      required: true
      example: ard
      selector:
        text:
    program_id:
      name: Programm-ID (UUID)
      description: >
        Optional. EPG-Programm-UUID einer Folge der Serie. Leer = aktuell
        laufende Sendung. Titel und Serien-ID werden daraus abgeleitet.
      required: false
      example: "67ad0d26-e3a4-5c4f-9837-ced96ae3b7e0"
      selector:
        text:

delete_serial_recording:
  name: Serien-Aufnahme beenden
  description: >
    Beendet eine laufende Serien-Aufnahme — künftige Folgen werden immer
    gestoppt, bereits aufgenommene/laufende Folgen bleiben erhalten,
    sofern nicht explizit zum Löschen ausgewählt.
  fields:
    series_id:
      name: Serien-ID
      description: >
        Die series_id aus den EPG-Attributen (z. B. sensor.<sender>_jetzt).
      required: true
      example: "104121"
      selector:
        text:
    delete_finished_recordings:
      name: Fertige Aufnahmen auch löschen
      description: Bereits abgeschlossene Aufnahmen dieser Serie mit entfernen.
      required: false
      default: false
      selector:
        boolean:
    delete_running_recordings:
      name: Laufende Aufnahmen auch löschen
      description: Gerade aufnehmende Folgen dieser Serie mit abbrechen.
      required: false
      default: false
      selector:
        boolean:

launch_on_apple_tv:
  name: Waipu auf Apple TV starten
  description: >
    Startet die Waipu-App auf dem in den Optionen konfigurierten Apple TV.
    Für die tvOS-App sind keine Sender-Deep-Links bekannt — der Sender muss
    anschließend manuell ausgewählt werden (anders als bei Android TV).
  fields:
    station_id:
      name: Sender-ID
      description: Aktuell nicht ausgewertet, reserviert für künftige Deep-Link-Unterstützung.
      required: false
      selector:
        text:

launch_on_android_tv:
  name: Waipu auf Android TV starten
  description: >
    Startet die Waipu-App auf dem in den Optionen konfigurierten Android TV
    (über die androidtv_remote-Integration). Mit Sender-ID wird direkt auf
    diesen Sender geschaltet, ohne Sender-ID öffnet sich der in den Optionen
    hinterlegte App-Link.
  fields:
    station_id:
      name: Sender-ID
      description: Optional. Die waipu-Station-ID (z. B. ard, zdf, swr_bw).
      required: false
      example: zdf
      selector:
        text:

switch_channel_on_android_tv:
  name: Sender auf Android TV wechseln
  description: >
    Schaltet per waipu-Deep-Link (waipu://tv?id=…) direkt auf den Sender um —
    funktioniert aus dem ausgeschalteten Zustand heraus und bei bereits
    laufender App, unabhängig von der Senderreihenfolge in der App.
  fields:
    station_id:
      name: Sender-ID
      description: Die waipu-Station-ID (z. B. ard, zdf, swr_bw).
      required: true
      example: swr_bw
      selector:
        text:

play_recording_on_android_tv:
  name: Aufnahme auf Android TV abspielen
  description: >
    Öffnet eine Cloud-Aufnahme per waipu-Deep-Link auf dem Android TV.
    Die Aufnahme muss fertig sein oder gerade aufnehmen.
  fields:
    recording_id:
      name: Aufnahme-ID
      description: >
        Die recording_id aus den Attributen von
        sensor.waipu_aufnahmen_aufnahmen_gesamt bzw. calendar.waipu_aufnahmen.
      required: true
      example: "1206434822"
      selector:
        text:
    mode:
      name: Start
      description: >
        Fortsetzen = an der von waipu gemerkten Stelle weiterschauen,
        Von vorn = ab Anfang abspielen, Nur Detailseite = Aufnahme öffnen,
        ohne abzuspielen.
      required: false
      default: resume
      selector:
        select:
          options:
            - label: Fortsetzen
              value: resume
            - label: Von vorn
              value: beginning
            - label: Nur Detailseite
              value: details
    position:
      name: Startposition (Sekunden)
      description: >
        Optional. Spielt ab dieser Stelle ab und hat Vorrang vor „Start“.
      required: false
      example: 600
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
          mode: box
